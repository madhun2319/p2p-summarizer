name: 🧬 BioPulse AI Weekly Pipeline

on:
  schedule:
    # Runs every Monday at 08:00 AM UTC in the cloud
    - cron: '0 8 * * 1'
  workflow_dispatch: # Enables 1-click manual trigger from GitHub UI anytime

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚡ Install uv Package Manager
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: false
          python-version: "3.11"

      - name: 🧪 Run Ingestion & Triage (Llama 3.1 8B)
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          uv run --with openai ingest.py

      - name: 📰 Generate Newsletter Digest (Llama 3.1 70B)
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          uv run --with openai newsletter.py

      - name: 📦 Save Newsletter Artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-newsletter-md
          path: |
            newsletter_*.md
            triaged_pdbs.json
          retention-days: 90

      - name: 📧 Send Newsletter via Email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_FROM }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "🧬 BioPulse AI — Proteins of the Week"
          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.EMAIL_FROM }}
          content_type: text/plain
          body: |
            🧬 BioPulse AI — Weekly Protein Intelligence Digest

            This week's newsletter has been generated automatically.
            See the attached markdown file for the full Top 5 digest.

            ---
            Generated by BioPulse AI Pipeline (NVIDIA NIM Llama 3.1)
          attachments: newsletter_*.md

      - name: 💬 Send Newsletter via Telegram
        if: success() && env.TELEGRAM_BOT_TOKEN != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Send a summary message
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            -d text="🧬 *BioPulse AI — Proteins of the Week*%0A%0ANewsletter generated successfully!%0ACheck your email or download from GitHub Actions."

          # Send the newsletter file directly
          NEWSLETTER_FILE=$(ls newsletter_*.md 2>/dev/null | head -1)
          if [ -n "$NEWSLETTER_FILE" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F chat_id="${TELEGRAM_CHAT_ID}" \
              -F document=@"$NEWSLETTER_FILE" \
              -F caption="📰 This week's protein digest"
          fi
